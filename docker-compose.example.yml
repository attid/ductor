services:
  ductor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ductor
    restart: unless-stopped
    environment:
      DUCTOR_HOME: /home/node/.ductor
      CODEX_HOME: /home/node/.codex
      TZ: UTC
    volumes:
      - ductor_data:/home/node/.ductor
      - codex_auth:/home/node/.codex
      - claude_auth:/home/node/.claude
      - gemini_auth:/home/node/.gemini
      - ductor_projects:/home/node/.ductor/workspace/projects

      # Optional: if you want ductor's internal docker sandbox mode inside this container
      # - /var/run/docker.sock:/var/run/docker.sock

    # Uncomment if you use inbound webhooks and expose webhooks.port from config.json
    # ports:
    #   - "8742:8742"

volumes:
  ductor_data:
  codex_auth:
  claude_auth:
  gemini_auth:
  ductor_projects:
