services:
  ductor:
    image: ghcr.io/attid/ductor:latest
    container_name: ductor
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=16m
    environment:
      DUCTOR_HOME: /home/node/.ductor
      CODEX_HOME: /home/node/.codex
      TZ: UTC
    volumes:
      - ductor_data:/home/node/.ductor
      - gemini_auth:/home/node/.gemini
      - codex_auth:/home/node/.codex
      - claude_auth:/home/node/.claude
      - ductor_projects:/home/node/.ductor/workspace/projects
    # ports:
    #   - "8742:8742"

volumes:
  ductor_data:
  gemini_auth:
  codex_auth:
  claude_auth:
  ductor_projects:
